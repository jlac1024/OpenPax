<?xml version="1.0" encoding="UTF-8"?>
<!-- OpenPax's own icon: a gold star in a tilted orbit, a small world on the
     ring, on a dark tile. Drawn for OpenPax; nothing of the original game's
     art is in it. tools/make_icon.sh renders it to every size used. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="tile" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="0.6" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#03060f"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#fff3b0"/>
      <stop offset="0.55" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#d07a00"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd860" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffb020" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a00"/>
      <stop offset="0.5" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#8a5a00"/>
    </linearGradient>
    <radialGradient id="world" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset="0.45" stop-color="#2aa8d8"/>
      <stop offset="1" stop-color="#0b3a66"/>
    </radialGradient>
    <clipPath id="back"><rect x="0" y="0" width="512" height="256"/></clipPath>
    <clipPath id="front"><rect x="0" y="256" width="512" height="256"/></clipPath>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#2c3f73" stroke-width="6"/>

  <g fill="#ffffff">
    <circle cx="92" cy="110" r="3" opacity="0.8"/>
    <circle cx="410" cy="88" r="2.5" opacity="0.7"/>
    <circle cx="430" cy="380" r="3" opacity="0.6"/>
    <circle cx="120" cy="420" r="2" opacity="0.6"/>
    <circle cx="70" cy="300" r="2" opacity="0.5"/>
    <circle cx="455" cy="230" r="2" opacity="0.5"/>
  </g>

  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- The far half of the orbit, behind the star. -->
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="196" ry="66" fill="none" stroke="url(#ring)" stroke-width="16" clip-path="url(#back)" opacity="0.85"/>
  </g>

  <!-- The star: four long points and four short ones. -->
  <path fill="url(#star)" stroke="#7a4600" stroke-width="3" stroke-linejoin="round"
        d="M256 34 L282 214 L358 154 L298 230 L478 256 L298 282 L358 358 L282 298 L256 478 L230 298 L154 358 L214 282 L34 256 L214 230 L154 154 L230 214 Z"/>

  <!-- The near half, in front, and a world riding it. -->
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="196" ry="66" fill="none" stroke="url(#ring)" stroke-width="16" clip-path="url(#front)"/>
    <circle cx="410" cy="297" r="30" fill="url(#world)" stroke="#06223f" stroke-width="4"/>
  </g>
</svg>
