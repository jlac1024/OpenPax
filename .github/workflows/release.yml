# Builds the release bundles (docs/platforms.md) and puts them on a GitHub
# release: Linux x64 (also as a .deb and a Flatpak) and Windows x64 on
# Ubuntu, Apple Silicon on macOS.
# None of the game is in them; the first run imports the player's own copy
# (docs/first-run.md). Runs for a version tag (v0.1.0) or by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 0.1.0 (a draft release v0.1.0 is made)
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  JOBS: 4

jobs:
  # The release is made here, first, as a draft, and its files are added at
  # the end. GitHub lets this workflow's token tag a commit only while that
  # commit's workflow files match main's, so tagging right away keeps a push
  # to .github/ during the build from failing the release.
  # Publishing a draft on GitHub creates its tag, which starts this workflow
  # again: a release that is already published is not built again.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION#v}"
          # A version's own notes if written (docs/releases/), else the general ones.
          notes="docs/releases/${VERSION#v}.md"
          [[ -f "$notes" ]] || notes=docs/release-notes.md
          draft="$(gh release view "$tag" --json isDraft -q .isDraft 2> /dev/null || echo none)"
          case "$draft" in
            false)
              echo "Release $tag is already published: nothing to build."
              echo "build=false" >> "$GITHUB_OUTPUT"
              ;;
            true)
              echo "Draft $tag exists: building its files again."
              gh release edit "$tag" --notes-file "$notes"
              echo "build=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              gh release create "$tag" --draft --title "OpenPax ${VERSION#v}" --notes-file "$notes" --target "${{ github.sha }}"
              echo "build=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The same cache as CI's (ci.yml): SDL3, FFmpeg and x264 built for
      # Linux, kept while their pins and build scripts stay the same. With
      # it restored nothing native is compiled, so the build packages are not needed.
      - id: native
        uses: actions/cache@v4
        with:
          path: |
            deps/archives
            deps/SDL3-*
            deps/ffmpeg-*
            deps/x264-*
            deps/fonts
            build/native
          key: native-linux-${{ hashFiles('tools/deps.toml', 'tools/build_ffmpeg.sh') }}
      - name: Packages
        if: steps.native.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends $(cat .github/linux-packages.txt)
      - name: Build and test
        run: ./build.sh
      - name: Package
        run: tools/package.sh linux-x64 "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/release/*.tar.gz

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The Windows libraries and converter, kept while their pins and build
      # script are the same. With them restored nothing is compiled, so the
      # cross-compilers (from Ubuntu's mirror, slow at times) are not needed.
      - id: native
        uses: actions/cache@v4
        with:
          path: |
            deps/archives
            build/native-win-x64
          key: native-win-${{ hashFiles('tools/deps.toml', 'tools/build_native_windows.sh') }}
      - name: Packages
        if: steps.native.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake nasm pkg-config zip rsync
      - name: Native libraries and the movie converter, cross-compiled
        if: steps.native.outputs.cache-hit != 'true'
        run: tools/build_native_windows.sh
      - name: Package
        run: tools/package.sh win-x64 "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: build/release/*.zip

  # The Windows installer, from the bundle the windows job made: Inno Setup
  # runs only on Windows (tools/installer/openpax.iss).
  windows-installer:
    needs: [check, windows]
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: bundle
      - name: Installer
        shell: pwsh
        run: |
          $version = "$env:VERSION".TrimStart('v')
          Expand-Archive "bundle/OpenPax-$version-win-x64.zip" -DestinationPath unpacked
          # The runner's own Inno Setup, else one from Chocolatey.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\unpacked\OpenPax-$version-win-x64" "/DOutputDir=$PWD\installer" tools\installer\openpax.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64-setup
          path: installer/*.exe

  # The Linux bundle as a .deb and a Flatpak (docs/platforms.md), each
  # installed and started once here: with no game imported, the game says so
  # and stops, which shows it runs from the package.
  linux-packages:
    needs: [check, linux]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: build/release
      - name: Unpack the bundle
        run: tar -xzf "build/release/OpenPax-${VERSION#v}-linux-x64.tar.gz" -C build/release
      - name: Packages
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends flatpak
      - name: .deb
        run: |
          deb="$(tools/package_deb.sh "${VERSION#v}")"
          sudo apt-get install -y --no-install-recommends "$deb"
          (openpax --headless 1 || true) 2>&1 | tee started.txt
          grep -q "No imported game data" started.txt
          mkdir -p packages && mv "$deb" packages/
      - name: Flatpak
        timeout-minutes: 20
        run: |
          flatpak="$(tools/package_flatpak.sh "${VERSION#v}")"
          # Ubuntu keeps unprivileged programs from the user namespaces the Flatpak sandbox is made of.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          export FLATPAK_USER_DIR="$PWD/deps/flatpak"
          flatpak install --user --noninteractive "$flatpak"
          (flatpak run io.github.jlac1024.OpenPax --headless 1 || true) 2>&1 | tee started.txt
          grep -q "No imported game data" started.txt
          mv "$flatpak" packages/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-packages
          path: packages/*

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages
        timeout-minutes: 10
        run: brew install cmake pkg-config
      # The same for the Mac (tools/build_native_macos.sh keeps a stamp too).
      - uses: actions/cache@v4
        with:
          path: build/native-osx-arm64
          key: native-mac-${{ hashFiles('tools/deps.toml', 'tools/build_native_macos.sh') }}
      - name: Native libraries and the movie converter
        run: tools/build_native_macos.sh
      - name: Package
        run: tools/package.sh osx-arm64 "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: osx-arm64
          path: build/release/*.tar.gz

  publish:
    needs: [linux, linux-packages, windows, windows-installer, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The bundles ship FFmpeg (LGPL libraries, and the GPL movie converter
      # with x264), so the exact source archives they were built from go on
      # the release beside them (THIRD-PARTY-NOTICES.md). deps.py checks
      # each against its pinned SHA-256; the build scripts are in tools/.
      - name: Source of the shipped FFmpeg and x264
        run: |
          python3 -I tools/deps.py fetch ffmpeg x264
          for name in ffmpeg x264; do
            archive="deps/archives/$(basename "$(python3 -I tools/deps.py get "$name" url)")"
            cp "$archive" "bundles/source-$(basename "$archive")"
          done
          ls -l bundles
      # Into the draft the check job made. Run by hand it stays a draft for
      # review; for a pushed version tag it is published once whole.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION#v}"
          gh release upload "$tag" bundles/* --clobber
          if [[ "${{ github.event_name }}" == push ]]; then
            gh release edit "$tag" --draft=false
          fi
