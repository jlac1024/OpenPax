# Builds the release bundles (docs/platforms.md) and puts them on a GitHub
# release: Linux x64 and Windows x64 on Ubuntu, Apple Silicon on macOS.
# None of the game is in them; the first run imports the player's own copy
# (docs/first-run.md). Runs for a version tag (v0.1.0) or by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 0.1.0 (a draft release v0.1.0 is made)
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  JOBS: 4

jobs:
  # Publishing a draft on GitHub creates its tag, which starts this workflow
  # again: when the release is already there, nothing is built.
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION#v}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release v${VERSION#v} already exists: nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $(cat .github/linux-packages.txt)
      # The same cache as CI's (ci.yml): SDL3, FFmpeg and x264 built for
      # Linux, kept while their pins and build scripts stay the same.
      - uses: actions/cache@v4
        with:
          path: |
            deps/archives
            deps/SDL3-*
            deps/ffmpeg-*
            deps/x264-*
            deps/fonts
            build/native
          key: native-linux-${{ hashFiles('tools/deps.toml', 'tools/build_ffmpeg.sh', 'build.sh') }}
      - name: Build and test
        run: ./build.sh
      - name: Package
        run: tools/package.sh linux-x64 "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/release/*.tar.gz

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake nasm pkg-config zip rsync
      # The Windows libraries and converter: the script rebuilds only what
      # its stamps say is out of date, so a restored folder is used as it is.
      - uses: actions/cache@v4
        with:
          path: |
            deps/archives
            build/native-win-x64
          key: native-win-${{ hashFiles('tools/deps.toml', 'tools/build_native_windows.sh') }}
      - name: Native libraries and the movie converter, cross-compiled
        run: tools/build_native_windows.sh
      - name: Package
        run: tools/package.sh win-x64 "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: build/release/*.zip

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages
        run: brew install cmake pkg-config
      # The same for the Mac (tools/build_native_macos.sh keeps a stamp too).
      - uses: actions/cache@v4
        with:
          path: build/native-osx-arm64
          key: native-mac-${{ hashFiles('tools/deps.toml', 'tools/build_native_macos.sh') }}
      - name: Native libraries and the movie converter
        run: tools/build_native_macos.sh
      - name: Package
        run: tools/package.sh osx-arm64 "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: osx-arm64
          path: build/release/*.tar.gz

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      # tools/deps.py reads TOML with tomllib (Python 3.11 and later).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The bundles ship FFmpeg (LGPL libraries, and the GPL movie converter
      # with x264), so the exact source archives they were built from go on
      # the release beside them (THIRD-PARTY-NOTICES.md). deps.py checks
      # each against its pinned SHA-256; the build scripts are in tools/.
      - name: Source of the shipped FFmpeg and x264
        run: |
          python3 -I tools/deps.py fetch ffmpeg x264
          for name in ffmpeg x264; do
            archive="deps/archives/$(basename "$(python3 -I tools/deps.py get "$name" url)")"
            cp "$archive" "bundles/source-$(basename "$archive")"
          done
          ls -l bundles
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION#v}"
          draft=()
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then draft=(--draft); fi
          # A version's own notes if written (docs/releases/), else the general ones.
          notes="docs/releases/${VERSION#v}.md"
          [[ -f "$notes" ]] || notes=docs/release-notes.md
          gh release create "$tag" bundles/* "${draft[@]}" --title "OpenPax ${VERSION#v}" --notes-file "$notes" --target "${{ github.sha }}"
